{% extends 'base.html' %}
{% load static %}
{% block title %}探索知识宇宙{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{% static 'css/element-plus/index.css' %}">
<link rel="stylesheet" href="{% static 'dist/assets/home.css' %}">
<style>
/* 强制移除body和main的白色背景 */
body, html {
  margin: 0 !important;
  padding: 0 !important;
  #height: 100% !important;
  min-height: 100vh !important;
  background: transparent !important;
  overflow: auto !important;
}

main {
  background: transparent !important;
  margin: 0 !important;
  padding: 0 !important;
  min-height: 100vh !important;
}

/* 确保Vue应用占满全屏 */
#home-app {
  width: 100%;
  min-height: 100vh;
}
</style>
{% endblock %}

{% block content %}
<div id="home-app"></div>

<!-- 加载构建后的Vue应用 -->
<script type="module" src="{% static 'dist/home.js' %}"></script>
{% endblock %}
