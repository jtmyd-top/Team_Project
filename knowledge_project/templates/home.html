{% extends 'base.html' %}
{% load static %}
{% block title %}知识宇宙 - 探索发现{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{% static 'dist/assets/home.css' %}?v=home-perf-lean-20260610">
<style>
/* 页面基础样式 */
body, html {
  margin: 0 !important;
  padding: 0 !important;
  min-height: 100vh !important;
  background-image: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 40%, #f3e8ff 100%) !important;
  background-attachment: fixed !important;
  background-size: cover !important;
  overflow-x: hidden !important;
}

main {
  background: transparent !important;
  margin: 0 !important;
  padding-top: 0 !important;
  min-height: 100vh !important;
}

/* 确保Vue应用占满全屏 */
#home-app {
  width: 100%;
  min-height: 100vh;
}

/* 自定义滚动条 */
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}
</style>
{% endblock %}

{% block content %}
<div id="home-app"></div>

<!-- 传递登录状态给前端 -->
<script>
  window.__HOME_DATA__ = {
    isAuthenticated: {{ user.is_authenticated|yesno:"true,false" }},
    loginUrl: '{% url "login" %}',
    signupUrl: '{% url "signup" %}'
  }
</script>

<!-- 加载构建后的Vue应用 -->
<script type="module" src="{% static 'dist/home.js' %}?v=home-perf-lean-20260610"></script>
{% endblock %}
