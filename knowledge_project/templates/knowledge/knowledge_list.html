{% extends 'base.html' %}
{% load static %}

{% block title %}知识笔记{% endblock %}

{% block head_extra %}
<!-- TinyMCE 编辑器 -->
<script src="{% static 'tinymce/tinymce.min.js' %}"></script>
<script src="{% static 'tinymce/langs/zh_CN.js' %}"></script>

<!-- Vite 构建提取的组件样式 -->
<link href="{% static 'JS/dist/assets/knowledge.css' %}?v={{ timestamp|default:'20250527-008' }}" rel="stylesheet">

<style>
  /* 适配应用全屏布局 - 禁止 body 滚动 */
  body {
    margin: 0;
    padding: 0;
    overflow: hidden !important;
  }
</style>
{% endblock %}

{% block content %}
<!-- Vue应用挂载点 -->
<div id="knowledge-app"></div>

<!-- 初始数据 -->
{{ initial_data|json_script:"initial-data" }}
{% endblock %}

{% block scripts %}
{% load static %}
<script type="module" src="{% static 'JS/dist/knowledge-list.js' %}?v={{ timestamp|default:'20250527-008' }}"></script>
{% endblock %}
