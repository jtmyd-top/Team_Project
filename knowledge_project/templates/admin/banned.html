[{"text": "{% load static %}\n<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>IP \u5df2\u5c01\u7981</title>\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <style>\n        * { box-sizing: border-box; margin: 0; padding: 0; }\n        body {\n            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n            min-height: 100vh;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);\n            padding: 20px;\n        }\n        .container {\n            background: rgba(255, 255, 255, 0.95);\n            border-radius: 16px;\n            padding: 40px;\n            width: 100%;\n            max-width: 420px;\n            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);\n            text-align: center;\n        }\n        .icon {\n            width: 80px;\n            height: 80px;\n            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);\n            border-radius: 50%;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            margin: 0 auto 24px;\n            color: white;\n            font-size: 36px;\n        }\n        h1 {\n            font-size: 24px;\n            color: #1f2937;\n            margin-bottom: 16px;\n        }\n        p {\n            color: #6b7280;\n            font-size: 15px;\n            line-height: 1.6;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <div class=\"icon\">\n            <i class=\"fas fa-ban\"></i>\n        </div>\n        <h1>403 \u7981\u6b62\u8bbf\u95ee</h1>\n        <p>{{ message }}</p>\n    </div>\n</body>\n</html>\n", "type": "text"}]
