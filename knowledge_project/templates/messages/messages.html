{% extends "base.html" %}
{% load static %}

{% block title %}私信{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{% static 'css/element-plus/index.css' %}">
<link rel="stylesheet" href="{% static 'dist/assets/element.css' %}">
<link rel="stylesheet" href="{% static 'dist/assets/messages.css' %}?v={{ messages_asset_version }}">
<style>
  main {
    padding: 0 !important;
  }
</style>
{% endblock %}

{% block content %}
<script>
// 注入用户ID
window.currentUserId = {{ user.id }};
window.MESSAGE_REALTIME = {
  enabled: {{ realtime_enabled|yesno:"true,false" }},
  wsPath: "{{ realtime_ws_path|escapejs }}"
};
</script>

<div id="messages-app"></div>
{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'dist/messages.js' %}?v={{ messages_asset_version }}"></script>
{% endblock %}
