{% extends "base.html" %}
{% load static %}

{% block title %}私信{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{% static 'dist/assets/el-message.css' %}?v={{ messages_asset_version }}">
<link rel="stylesheet" href="{% static 'dist/assets/el4.css' %}?v={{ messages_asset_version }}">
<link rel="stylesheet" href="{% static 'dist/assets/el-input.css' %}?v={{ messages_asset_version }}">
<link rel="stylesheet" href="{% static 'dist/assets/el-overlay.css' %}?v={{ messages_asset_version }}">
<link rel="stylesheet" href="{% static 'dist/assets/index2.css' %}?v={{ messages_asset_version }}">
<link rel="stylesheet" href="{% static 'dist/assets/messages.css' %}?v={{ messages_asset_version }}">
<style>
  main {
    padding: 0 !important;
  }
</style>
{% endblock %}

{% block content %}
{{ user.profile.theme|json_script:"themeData" }}
<script>
// 注入用户ID和配置
window.currentUserId = {{ user.id }};
window.currentUsername = "{{ user.username|escapejs }}";
window.userTheme = JSON.parse(document.getElementById('themeData').textContent);
window.MESSAGE_REALTIME = {
  enabled: {% if realtime_enabled %}true{% else %}false{% endif %},
  wsPath: "{{ realtime_ws_path|escapejs }}"
};
</script>

<div id="messages-app"></div>
{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'dist/messages.js' %}?v={{ messages_asset_version }}"></script>
{% endblock %}
