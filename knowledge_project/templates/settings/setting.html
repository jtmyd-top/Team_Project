{% extends "base.html" %}
{% load static %}

{% block title %}账户设置{% endblock %}

{% block head_extra %}
<script type="module" src="{% static 'JS/dist/settings.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/setting.css' %}">
<link rel="stylesheet" href="{% static 'css/element-plus/index.css' %}">
<link rel="stylesheet" href="{% static 'fontawesome-free-6.7.2/css/all.min.css' %}">
<!-- Vite构建生成的样式 -->
<link rel="stylesheet" href="{% static 'JS/dist/assets/settings-BtwUfqs9.css' %}">
{% endblock %}

{% block content %}
<script>
// 注入初始数据到前端
window.SETTINGS_INITIAL = {
    csrfToken: '{{ csrf_token }}',
    user: {
        id: {{ user.id }},
        nickname: '{{ user.username|escapejs }}',
        email: '{{ user.email|escapejs }}',
        bio: '{{ user.profile.bio|default_if_none:""|escapejs }}',
        avatar: '{{ user.profile.avatar_url|default:"/static/img/default-avatar.png"|escapejs }}',
        banner: '{% if user.profile.banner_image %}{{ user.profile.banner_image.url|escapejs }}{% else %}{% endif %}',
        two_fa_enabled: {{ user.profile.two_fa_enabled|yesno:"true,false" }},
        two_fa_method: '{{ user.profile.two_fa_method|default:"totp"|escapejs }}',
        likes_count: {{ likes_count|default:0 }},
        notes_count: {{ notes_count|default:0 }},
        views_count: {{ views_count|default:0 }},
        is_liked: {{ is_liked|yesno:"true,false" }}
    }
};

// API端点配置
window.API_ENDPOINTS = {
    updateProfile: '{% url "update_profile" %}',
    changePassword: '{% url "change_password" %}',
    checkUsername: '{% url "check_username" %}',
    checkEmail: '{% url "check_email" %}',
    updateEmail: '{% url "update_email" %}',
    sendEmailCode: '{% url "send_email_code" %}',
    uploadAvatar: '{% url "upload_avatar" %}',
    enable2FA: '{% url "enable_2fa" %}',
    disable2FA: '{% url "disable_2fa" %}',
    sendOperation2FA: '{% url "send_operation_2fa_code" %}',
    regenerateBackupCodes: '{% url "regenerate_backup_codes" %}',
    toggleLike: '{% url "toggle_profile_like" %}',
    getNotificationSettings: '/api/notification-preferences/',
    updateNotificationSettings: '/api/notification-preferences/',
    getThemeSettings: '/api/theme-settings/',
    updateThemeSettings: '/api/theme-settings/'
};
</script>

<!-- Vue 应用挂载点 -->
<div id="settings-app"></div>
{% endblock %}
