{% extends 'base.html' %}
{% load static %}
{% block title %}注册新用户{% endblock %}
{% block head_extra %}
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="stylesheet" href="{% static 'css/element-plus/index.css' %}">
<link rel="stylesheet" href="{% static 'css/glassmorphism.css' %}">
<link rel="stylesheet" href="{% static 'css/modern-inputs.css' %}">
<!-- 强制刷新 api-service.js -->
<script type="module" src="{% static 'JS/src/services/apiService.js' %}?v={{ timestamp|default:'20241214-007' }}"></script>
{% endblock %}

{% block content %}
<div class="glassmorphism-container">
  <!-- 主要内容区域 - 移除重复的导航栏 -->
  <div class="login-content">
    <div id="signup-app" class="glass-card glass-card-medium rotate-in">
      <!-- Vue应用将在这里渲染 -->
    </div>
  </div>
</div>

<style>
/* 强制移除body和main的白色背景，添加统一的渐变色 */
body, html {
  margin: 0 !important;
  padding: 0 !important;
  height: 100% !important;
  min-height: 100vh !important;
  background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%) !important;
}

main {
  background: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  min-height: 100vh !important;
}

.login-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  min-height: 100vh;
  /* 隔离背景动画影响 */
  position: relative;
  z-index: 1;
  transform-style: preserve-3d;
  perspective: 1000px;
}

/* 调整Vue应用内部样式以适配毛玻璃效果 - 增大卡片尺寸并居中 */
#signup-app {
  width: 100%;
  max-width: 550px !important;
  min-width: 450px !important;
  padding: 3.5rem 3rem !important;
  text-align: center;
  margin: 0 auto !important;
  box-sizing: border-box !important;
}

/* 毛玻璃标题样式 */
#signup-app .glass-title {
  margin-bottom: 20px;
}

#signup-app .glass-subtitle {
  margin-bottom: 40px;
}

/* 表单元素现代化样式 */
#signup-app .el-form-item {
  margin-bottom: 28px;
}

/* ==================== 邮箱验证码布局优化 ==================== */
#signup-app .email-code-container {
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  width: 100% !important;
}

#signup-app .email-code-input {
  width: 61% !important;
  flex: none !important;
}

#signup-app .email-code-input .el-input__wrapper {
  width: 100% !important;
}

#signup-app .email-code-button {
  width: 34% !important;
  flex: none !important;
  min-width: 0 !important;
  height: 52px !important;
  font-size: 14px !important;
  padding: 0 12px !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

/* 邮箱验证码响应式布局 */
@media (max-width: 768px) {
  #signup-app .email-code-input {
    width: 65% !important;
  }

  #signup-app .email-code-button {
    width: 35% !important;
    font-size: 13px !important;
    padding: 0 8px !important;
    height: 48px !important;
  }
}

@media (max-width: 480px) {
  #signup-app .email-code-container {
    flex-direction: column !important;
    gap: 12px !important;
    align-items: stretch !important;
  }

  #signup-app .email-code-input {
    width: 100% !important;
  }

  #signup-app .email-code-button {
    width: 100% !important;
    height: 48px !important;
    font-size: 14px !important;
    padding: 0 16px !important;
  }
}


/* 使用现代化输入框样式，覆盖毛玻璃效果的默认样式 */
#signup-app .el-input__wrapper {
  background: rgba(255, 255, 255, 0.18) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
  border: 1px solid rgba(255, 255, 255, 0.3) !important;
  border-radius: 16px !important;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.12),
    inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  padding: 0 !important;
}

#signup-app .el-input__wrapper:hover {
  background: rgba(255, 255, 255, 0.22) !important;
  border-color: rgba(255, 255, 255, 0.4) !important;
  transform: translateY(-2px) !important;
  box-shadow:
    0 12px 40px rgba(0, 0, 0, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
}

#signup-app .el-input__wrapper.is-focus {
  background: rgba(255, 255, 255, 0.28) !important;
  border-color: rgba(59, 130, 246, 0.6) !important;
  transform: translateY(-3px) !important;
  box-shadow:
    0 0 0 4px rgba(59, 130, 246, 0.15),
    0 16px 48px rgba(0, 0, 0, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
}

#signup-app .el-input__inner {
  color: #1f2937 !important;
  font-weight: 500 !important;
  font-size: 15px !important;
  padding: 16px 22px !important;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  -webkit-text-fill-color: #1f2937 !important;
  caret-color: #3b82f6 !important;
  height: auto !important;
  line-height: 1.5 !important;
}

#signup-app .el-input__inner::placeholder {
  color: rgba(31, 41, 55, 0.65) !important;
  font-weight: 400 !important;
  opacity: 0.9 !important;
}

/* 前缀图标样式 */
#signup-app .el-input__prefix {
  color: rgba(31, 41, 55, 0.6) !important;
  margin-left: 2px !important;
}

#signup-app .el-input__prefix i {
  font-size: 16px !important;
}

/* 后缀图标样式（密码可见性按钮） */
#signup-app .el-input__suffix {
  color: rgba(31, 41, 55, 0.6) !important;
  margin-right: 2px !important;
}

#signup-app .el-input__suffix i {
  font-size: 16px !important;
  cursor: pointer !important;
  transition: color 0.2s ease !important;
}

#signup-app .el-input__suffix i:hover {
  color: rgba(31, 41, 55, 0.8) !important;
}

/* 默认隐藏验证规则提示 - 不占据空间 */
#signup-app .validation-rules {
  max-height: 0;
  opacity: 1;
  overflow: hidden;
  transition: all 0.3s ease;
  pointer-events: none;
  margin: 0;
  font-size: 12px;
  text-align: left;
}

/* 聚焦时显示验证规则提示 - 展开空间 */
#signup-app .validation-rules.show {
  max-height: 200px;
  opacity: 1;
  pointer-events: auto;
  margin-top: 8px;
}

/* 验证规则项样式 */
#signup-app .validation-rule {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  color: rgba(255, 255, 255, 0.8);
  font-size: 11px;
}

#signup-app .validation-rule i {
  font-size: 10px;
}

#signup-app .validation-rule.rule-valid {
  color: #10b981;
}

#signup-app .validation-rule.rule-invalid {
  color: rgba(255, 255, 255, 0.6);
}

/* 密码强度指示器 - 默认不占据空间 */
#signup-app .password-strength {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: all 0.3s ease;
  margin: 0;
  font-size: 12px;
  text-align: left;
  background: rgba(0, 0, 0, 0.2);
  padding: 0 8px;
  border-radius: 6px;
  backdrop-filter: blur(5px);
}

/* 密码强度条 */
#signup-app .strength-bars {
  display: flex;
  gap: 2px;
  margin-bottom: 6px;
  opacity: 0;
  transition: opacity 0.2s ease 0.1s;
}

/* 显示时才显示强度条 */
#signup-app .password-strength:not([style*="max-height: 0"]) .strength-bars {
  opacity: 1;
}

#signup-app .strength-bar {
  flex: 1;
  height: 3px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 2px;
  transition: all 0.3s ease;
}

#signup-app .strength-bar.strength-weak {
  background: #ef4444;
}

#signup-app .strength-bar.strength-medium {
  background: #f59e0b;
}

#signup-app .strength-bar.strength-strong {
  background: #10b981;
}

#signup-app .strength-bar.strength-very-strong {
  background: #059669;
}

/* 密码强度文字 */
#signup-app .strength-text {
  font-size: 11px;
  font-weight: 500;
}

#signup-app .strength-text.strength-0 {
  color: rgba(255, 255, 255, 0.6);
}

#signup-app .strength-text.strength-1 {
  color: #ef4444;
}

#signup-app .strength-text.strength-2 {
  color: #f59e0b;
}

#signup-app .strength-text.strength-3 {
  color: #10b981;
}

#signup-app .strength-text.strength-4 {
  color: #059669;
}

/* 输入框聚焦时显示密码强度 - 展开空间 */
#signup-app .el-form-item:focus-within .password-strength {
  max-height: 100px;
  opacity: 1;
  margin-top: 8px;
  padding: 8px;
}

#signup-app .el-button {
  background: rgba(255, 255, 255, 0.1) !important;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2) !important;
  border-radius: 12px !important;
  color: white !important;
  font-weight: 500;
  transition: all 0.3s ease;
}

#signup-app .el-button--primary {
  background: linear-gradient(135deg, rgba(120, 119, 198, 0.8), rgba(255, 119, 198, 0.8)) !important;
  border: 1px solid rgba(255, 255, 255, 0.3) !important;
}

#signup-app .el-button:hover {
  background: rgba(255, 255, 255, 0.15) !important;
  border-color: rgba(255, 255, 255, 0.3) !important;
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3) !important;
}

#signup-app .el-button--primary:hover {
  background: linear-gradient(135deg, rgba(120, 119, 198, 1), rgba(255, 119, 198, 1)) !important;
}

/* 链接样式 */
#signup-app a {
  color: rgba(255, 255, 255, 0.8) !important;
  text-decoration: none;
  transition: all 0.3s ease;
}

#signup-app a:hover {
  color: white !important;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* 错误信息样式 */
#signup-app .el-form-item__error {
  color: #ff6b6b !important;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
}

/* 优雅的入场旋转动画 */
.rotate-in {
  animation: rotateInScale 1.2s var(--ease-out-back) forwards;
  transform-origin: center center;
  /* 强制隔离父容器动画 */
  isolation: isolate;
  will-change: transform, opacity;
  /* 确保不被父容器动画影响 */
  backface-visibility: hidden;
  perspective: 1000px;
}

@keyframes rotateInScale {
  0% {
    opacity: 0;
    transform: rotate(-15deg) scale(0.8);
  }
  50% {
    transform: rotate(8deg) scale(1.05);
  }
  100% {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
}

/* 确保动画结束后保持正确方向 */
.rotate-in.animation-complete {
  transform: rotate(0deg) scale(1) !important;
  animation: none !important;
  /* 完全锁定，防止任何后续动画干扰 */
  will-change: auto;
}

/* 响应式设计 */
@media (max-width: 768px) {
  #signup-app {
    max-width: 90% !important;
    min-width: unset !important;
    padding: 2.5rem 2rem !important;
  }
  
  #signup-app .glass-title {
    font-size: 1.8rem !important;
  }
}

@media (max-width: 480px) {
  #signup-app {
    max-width: 95% !important;
    padding: 2rem 1.5rem !important;
  }
  
  #signup-app .glass-title {
    font-size: 1.6rem !important;
  }
  
  #signup-app .glass-subtitle {
    font-size: 1rem !important;
  }
}
</style>

<!-- 加载构建后的Vue应用 -->
<script type="module" src="{% static 'dist/signup.js' %}?v=20241217-001"></script>

<script>
// 设置CSRF令牌供JavaScript使用
window.SETTINGS_INITIAL = window.SETTINGS_INITIAL || {};
window.SETTINGS_INITIAL.csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

// 确保动画结束后保持正确的方向
document.addEventListener('DOMContentLoaded', function() {
  const signupApp = document.getElementById('signupApp');
  if (signupApp) {
    // 监听动画结束事件
    signupApp.addEventListener('animationend', function() {
      signupApp.classList.add('animation-complete');
    });

    // 备用：如果动画事件没有触发，1.5秒后也锁定状态
    setTimeout(function() {
      signupApp.classList.add('animation-complete');
    }, 1500);
  }

  // Vue应用已经通过CSS和Vue组件逻辑处理了所有交互
  // 这里不需要额外的JavaScript代码
});
</script>
{% endblock %}
