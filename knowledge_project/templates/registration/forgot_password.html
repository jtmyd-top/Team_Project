{% extends 'base.html' %}
{% load static %}
{% block title %}忘记密码{% endblock %}

{% block head_extra %}
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="stylesheet" href="{% static 'JS/dist/assets/element.css' %}">
<link rel="stylesheet" href="{% static 'css/glassmorphism.css' %}">
<link rel="stylesheet" href="{% static 'css/modern-inputs.css' %}">
<link rel="stylesheet" href="{% static 'JS/dist/assets/forgot.css' %}">
{% endblock %}

{% block content %}
<div class="glassmorphism-container">
  <!-- 主要内容区域 -->
  <div class="login-content">
    <div id="forgot-password-app" class="glass-card glass-card-medium rotate-in">
      <!-- Vue应用将在这里渲染 -->
    </div>
  </div>
</div>

<script>
// 设置初始数据供Vue组件使用
window.FORGOT_PASSWORD_INITIAL = {
  user_is_authenticated: {{ user.is_authenticated|lower }},
  csrf_token: '{{ csrf_token }}'
};
</script>

<!-- 加载构建后的Vue应用 -->
<script type="module" src="{% static 'JS/dist/forgot-password.js' %}"></script>

<style>
/* 强制移除body和main的白色背景 */
body, html {
  margin: 0 !important;
  padding: 0 !important;
  height: 100% !important;
  min-height: 100vh !important;
  background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%) !important;
}

main {
  background: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  min-height: 100vh !important;
}

/* 确保玻璃态容器正确显示 */
.glassmorphism-container {
  min-height: 100vh !important;
  background: transparent !important;
}

/* 移除任何可能的干扰样式 */
.login-content {
  background: transparent !important;
  margin: auto;
}
</style>
{% endblock %}
