{% load static %}

<!DOCTYPE html>
<html lang="zh-hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码</title>

  <!-- FontAwesome -->
  <link href="{% static 'fontawesome-free-6.7.2/css/all.min.css' %}" rel="stylesheet">

  <!-- Theme CSS -->
  <link href="{% static 'css/base.css' %}" rel="stylesheet">
  <link href="{% static 'css/modern-inputs.css' %}" rel="stylesheet">

  <style>
    body {
      background-color: var(--bg-secondary);
    }

    header {
      display: none; /* 隐藏顶部导航 */
    }

    main {
      width: 100%;
      max-width: none;
      padding: 0;
      background: none;
    }

    .reset-password-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: url("/static/img/白金极简纹理.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .reset-password-card {
      width: 100%;
      max-width: 450px;
      padding: 3rem;
      background: var(--bg-primary);
      border-radius: 20px;
      box-shadow: var(--shadow-dark);
      transition: var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .success-animation {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .success-animation.show {
      opacity: 1;
      visibility: visible;
    }

    .success-icon {
      font-size: 4rem;
      color: #67c23a;
      margin-bottom: 1rem;
      animation: successBounce 0.5s ease;
    }

    @keyframes successBounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .card-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 1rem;
      transition: var(--transition-fast);
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-color-light);
    }

    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 0.5rem;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background-color: var(--bg-tertiary);
      border-radius: 2px;
      transition: var(--transition-fast);
    }

    .strength-bar.active {
      background-color: #f56c6c;
    }

    .strength-bar.weak {
      background-color: #f56c6c;
    }

    .strength-bar.medium {
      background-color: #e6a23c;
    }

    .strength-bar.strong {
      background-color: #67c23a;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-color-dark) 100%);
      color: var(--text-inverse);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(64, 158, 255, 0.3);
    }

    .submit-btn:disabled {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .submit-btn.loading {
      pointer-events: none;
    }

    .submit-btn.loading::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% {
        left: -100%;
      }
      100% {
        left: 100%;
      }
    }

    .message {
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.success {
      background-color: #f0f9ff;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .message.error {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .error-container {
      text-align: center;
      padding: 3rem 2rem;
    }

    .error-icon {
      font-size: 4rem;
      color: #f56c6c;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.5rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .error-text {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: var(--bg-tertiary);
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 8px;
      transition: var(--transition-fast);
    }

    .btn-back:hover {
      background-color: var(--hover-bg);
      color: var(--text-primary);
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .password-toggle:hover {
      color: var(--text-secondary);
    }

    /* 响应式设计 */
    @media (max-width: 480px) {
      .reset-password-container {
        padding: 1rem;
      }

      .reset-password-card {
        padding: 2rem 1.5rem;
      }

      .card-title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  {% if error %}
    <div class="reset-password-container">
      <div class="forgot-password-card">
        <div class="error-container">
          <i class="fas fa-exclamation-circle error-icon"></i>
          <h2 class="error-title">链接无效</h2>
          <p class="error-text">{{ error }}</p>
          <a href="/forgot-password/" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            重新发送重置链接
          </a>
        </div>
      </div>
    </div>
  {% else %}
    <div id="resetPasswordApp" class="reset-password-container">
      <div class="reset-password-card">
        <div class="success-animation" id="successAnimation">
          <i class="fas fa-check-circle success-icon"></i>
          <h2 style="color: var(--text-primary); margin-bottom: 0.5rem;">重置成功！</h2>
          <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">密码已成功更新</p>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">正在跳转到首页...</p>
        </div>

        <div id="formContent">
          <div class="card-header">
            <h1 class="card-title">
              <i class="fas fa-lock"></i>
              重置密码
            </h1>
            <p class="card-subtitle">
              您好，<strong>{{ username }}</strong>！请设置您的新密码
            </p>
          </div>

          <form id="resetForm" class="reset-form" method="post">
            {% csrf_token %}
            <input type="hidden" id="userId" value="{{ user_id }}">
            <input type="hidden" id="token" value="{{ token }}">

            <div class="form-group" style="position: relative;">
              <label for="password">新密码</label>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="请输入新密码（至少8位）"
                required
                minlength="8"
              >
              <i class="fas fa-eye password-toggle" id="passwordToggle" data-target="password"></i>
              <div class="password-strength">
                <div class="strength-bar" data-level="1"></div>
                <div class="strength-bar" data-level="2"></div>
                <div class="strength-bar" data-level="3"></div>
                <div class="strength-bar" data-level="4"></div>
              </div>
            </div>

            <div class="form-group" style="position: relative;">
              <label for="confirmPassword">确认密码</label>
              <input
                type="password"
                id="confirmPassword"
                class="form-input"
                placeholder="请再次输入新密码"
                required
              >
              <i class="fas fa-eye password-toggle" id="confirmPasswordToggle" data-target="confirmPassword"></i>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
              <i class="fas fa-key" style="margin-right: 8px;"></i>
              确认重置密码
            </button>

            <div id="messageContainer"></div>
          </form>
        </div>
      </div>
    </div>
  {% endif %}

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 如果有错误信息，不需要执行后续脚本
      if (document.querySelector('.error-container')) return;

      const form = document.getElementById('resetForm');
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submitBtn');
      const messageContainer = document.getElementById('messageContainer');
      const passwordToggle = document.getElementById('passwordToggle');
      const confirmPasswordToggle = document.getElementById('confirmPasswordToggle');
      const strengthBars = document.querySelectorAll('.strength-bar');

      // 显示消息
      function showMessage(text, type) {
        messageContainer.innerHTML = `
          <div class="message ${type}">
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
            ${text}
          </div>
        `;
      }

      // 密码强度检测
      function checkPasswordStrength(password) {
        let strength = 0;

        if (password.length >= 8) strength++;
        if (password.length >= 12) strength++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        if (/\d/.test(password)) strength++;
        if (/[^a-zA-Z\d]/.test(password)) strength++;

        strengthBars.forEach((bar, index) => {
          bar.className = 'strength-bar';
          if (index < strength) {
            if (strength <= 2) bar.classList.add('weak');
            else if (strength === 3) bar.classList.add('medium');
            else bar.classList.add('strong');
            bar.classList.add('active');
          }
        });

        return strength;
      }

      // 密码显示/隐藏切换
      passwordToggle.addEventListener('click', function() {
        const target = document.getElementById(this.dataset.target);
        if (target.type === 'password') {
          target.type = 'text';
          this.classList.remove('fa-eye');
          this.classList.add('fa-eye-slash');
        } else {
          target.type = 'password';
          this.classList.remove('fa-eye-slash');
          this.classList.add('fa-eye');
        }
      });

      confirmPasswordToggle.addEventListener('click', function() {
        const target = document.getElementById(this.dataset.target);
        if (target.type === 'password') {
          target.type = 'text';
          this.classList.remove('fa-eye');
          this.classList.add('fa-eye-slash');
        } else {
          target.type = 'password';
          this.classList.remove('fa-eye-slash');
          this.classList.add('fa-eye');
        }
      });

      // 密码输入时检测强度
      passwordInput.addEventListener('input', function() {
        checkPasswordStrength(this.value);
      });

      // 处理表单提交
      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // 验证密码
        if (!password || !confirmPassword) {
          showMessage('请填写所有字段', 'error');
          return;
        }

        if (password !== confirmPassword) {
          showMessage('两次输入的密码不一致', 'error');
          return;
        }

        if (password.length < 8) {
          showMessage('密码长度至少为8位', 'error');
          return;
        }

        // 禁用按钮，显示加载状态
        submitBtn.disabled = true;
        submitBtn.classList.add('loading');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i>正在重置...';

        try {
          // 使用FormData提交表单
          const formData = new FormData(form);
          formData.append('password', password);
          formData.append('confirm_password', confirmPassword);

          const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
              'X-Requested-With': 'XMLHttpRequest'
            }
          });

          if (response.ok) {
            // 检查是否是JSON响应
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
              const data = await response.json();
              if (data.status === 'success') {
                // 显示成功动画
                document.getElementById('formContent').style.display = 'none';
                document.getElementById('successAnimation').classList.add('show');

                // 2秒后跳转
                setTimeout(() => {
                  window.location.href = data.redirect_url || '/';
                }, 2000);
              } else {
                showMessage(data.message || '重置失败，请稍后重试', 'error');
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<i class="fas fa-key" style="margin-right: 8px;"></i>确认重置密码';
              }
            } else {
              // 检查是否是重定向响应
              if (response.redirected) {
                // 直接跳转到重定向的URL
                window.location.href = response.url;
              } else {
                // 尝试解析HTML响应
                const text = await response.text();
                if (text.includes('重置成功') || response.url === '/') {
                  // 显示成功动画
                  document.getElementById('formContent').style.display = 'none';
                  document.getElementById('successAnimation').classList.add('show');

                  // 2秒后跳转
                  setTimeout(() => {
                    window.location.href = '/';
                  }, 2000);
                } else {
                  showMessage('重置失败，请稍后重试', 'error');
                  submitBtn.disabled = false;
                  submitBtn.classList.remove('loading');
                  submitBtn.innerHTML = '<i class="fas fa-key" style="margin-right: 8px;"></i>确认重置密码';
                }
              }
            }
          } else {
            const data = await response.json();
            showMessage(data.message || '重置失败，请稍后重试', 'error');
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
            submitBtn.innerHTML = '<i class="fas fa-key" style="margin-right: 8px;"></i>确认重置密码';
          }
        } catch (error) {
          console.error('重置密码失败:', error);
          showMessage('网络错误，请稍后重试', 'error');
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          submitBtn.innerHTML = '<i class="fas fa-key" style="margin-right: 8px;"></i>确认重置密码';
        }
      });
    });
  </script>
</body>
</html>
