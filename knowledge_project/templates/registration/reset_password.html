{% extends 'base.html' %}
{% load static %}
{% block title %}重置密码{% endblock %}

{% block head_extra %}
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="stylesheet" href="{% static 'JS/dist/assets/element.css' %}">
<link rel="stylesheet" href="{% static 'css/glassmorphism.css' %}">
<link rel="stylesheet" href="{% static 'css/modern-inputs.css' %}">
<link rel="stylesheet" href="{% static 'JS/dist/assets/reset.css' %}">
{% endblock %}

{% block content %}
<div class="glassmorphism-container">
  <!-- 主要内容区域 -->
  <div class="login-content">
    <div id="reset-password-app" class="glass-card glass-card-medium rotate-in">
      <!-- Vue应用将在这里渲染 -->
    </div>
  </div>
</div>

<style>
/* 强制移除body和main的白色背景 */
body, html {
  margin: 0 !important;
  padding: 0 !important;
  height: 100% !important;
  min-height: 100vh !important;
  background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%) !important;
}

main {
  background: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  min-height: 100vh !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

/* 确保玻璃态容器正确显示并居中 */
.glassmorphism-container {
  min-height: 100vh !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 100% !important;
}

/* 登录内容区域居中 */
.login-content {
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 100% !important;
  padding: 2rem !important;
}

/* 重置密码卡片样式 - 增大尺寸并居中 */
#reset-password-app.glass-card {
  width: 100% !important;
  max-width: 550px !important;
  min-width: 450px !important;
  padding: 3.5rem 3rem !important;
  margin: 0 auto !important;
  box-sizing: border-box !important;
}

/* 卡片内部元素样式 */
#reset-password-app .glass-title {
  font-size: 2.2rem !important;
  margin-bottom: 1.5rem !important;
  text-align: center !important;
}

#reset-password-app .glass-subtitle {
  font-size: 1.1rem !important;
  margin-bottom: 2rem !important;
  text-align: center !important;
  line-height: 1.6 !important;
}

#reset-password-app .glass-input {
  width: 100% !important;
  padding: 1rem 1.2rem !important;
  font-size: 1rem !important;
  margin-bottom: 1.5rem !important;
}

#reset-password-app .glass-button {
  width: 100% !important;
  padding: 1rem !important;
  font-size: 1rem !important;
  margin-top: 1rem !important;
}

#reset-password-app .el-alert {
  margin-bottom: 1.5rem !important;
  font-size: 0.95rem !important;
}

/* 响应式设计 */
@media (max-width: 768px) {
  #reset-password-app.glass-card {
    max-width: 90% !important;
    min-width: unset !important;
    padding: 2.5rem 2rem !important;
  }
  
  .login-content {
    padding: 1.5rem !important;
  }
  
  #reset-password-app .glass-title {
    font-size: 1.8rem !important;
  }
}

@media (max-width: 480px) {
  #reset-password-app.glass-card {
    max-width: 95% !important;
    padding: 2rem 1.5rem !important;
  }
  
  .login-content {
    padding: 1rem !important;
  }
  
  #reset-password-app .glass-title {
    font-size: 1.6rem !important;
  }
  
  #reset-password-app .glass-subtitle {
    font-size: 1rem !important;
  }
}
</style>

<script>
// 设置初始数据供Vue组件使用
window.RESET_PASSWORD_INITIAL = {
  user_is_authenticated: {{ user.is_authenticated|lower }},
  userId: {{ user_id|default:'null' }},
  token: '{{ token|default:"" }}',
  username: '{{ username|default:"" }}',
  error: {{ error|default:'null' }}
};
</script>

<!-- 加载构建后的Vue应用 -->
<script type="module" src="{% static 'JS/dist/reset-password.js' %}?v=20241215-001"></script>
{% endblock %}
