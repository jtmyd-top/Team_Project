{% extends 'base.html' %}
{% load static %}
{% load static_files %}
{% block title %}用户登录{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{% static 'css/element-plus/index.css' %}">
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<style>
  main {
    padding-top: 0 !important;
  }
</style>
{% endblock %}

{% block content %}
<div id="login-app">
  <!-- Vue应用将在这里渲染 -->
</div>

<!-- 加载构建后的Vue应用 -->
{% static_mtime 'dist/login.js' as login_js_version %}
<script type="module" src="{% static 'dist/login.js' %}?v={{ login_js_version }}"></script>
{% endblock %}
