<!DOCTYPE html>

<html class="" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account Security Protection - Knowledge Management System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#359EFF", secondary: "#EF4444", "background-light": "#f5f7f8", "background-dark": "#0f1923", "surface-light": "#FFFFFF", "surface-dark": "#252640", "text-main-light": "#1F2937", "text-main-dark": "#F3F4F6", "text-sub-light": "#6B7280", "text-sub-dark": "#9CA3AF"}, fontFamily: {display: "Manrope"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, boxShadow: {soft: "0 10px 40px -10px rgba(0,0,0,0.05)", glow: "0 0 20px rgba(107, 115, 214, 0.3)", "red-glow": "0 0 20px rgba(239, 68, 68, 0.2)"}}}};</script>
<style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        .bg-gradient-custom {
            background: radial-gradient(circle at top left, #EBE9FF 0%, transparent 40%),
                        radial-gradient(circle at bottom right, #FFEBF2 0%, transparent 40%),
                        linear-gradient(180deg, #FFFFFF 0%, #F8F9FE 100%);
        }
        .dark .bg-gradient-custom {
             background: radial-gradient(circle at top left, #2d2b55 0%, transparent 40%),
                        radial-gradient(circle at bottom right, #4a2635 0%, transparent 40%),
                        linear-gradient(180deg, #1a1b2e 0%, #11121f 100%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark transition-colors duration-300 min-h-screen flex flex-col font-display">
<nav class="w-full px-8 py-6 flex items-center justify-between z-10 relative">
<div class="flex items-center space-x-8 text-sm font-medium text-text-sub-light dark:text-text-sub-dark">
<a class="hover:text-primary transition-colors" href="#">首页</a>
<a class="hover:text-primary transition-colors" href="#">登录</a>
<a class="hover:text-primary transition-colors" href="#">注册</a>
</div>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-icons-round text-text-sub-light dark:text-text-sub-dark">brightness_4</span>
</button>
</nav>
<main class="flex-grow flex items-center justify-center relative px-4 pb-20 bg-gradient-custom">
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[100px] dark:bg-primary/20"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-pink-200/30 rounded-full blur-[100px] dark:bg-pink-900/20"></div>
</div>
<div class="relative z-10 w-full max-w-md bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft p-10 border border-white/50 dark:border-white/5">
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 rounded-full bg-red-50 dark:bg-red-900/20 flex items-center justify-center mb-6 shadow-red-glow">
<span class="material-icons-round text-secondary text-3xl">gpp_maybe</span>
</div>
<h1 class="text-2xl font-bold text-text-main-light dark:text-text-main-dark mb-2 text-center">
                    账户安全保护已启动
                </h1>
<p class="text-text-sub-light dark:text-text-sub-dark text-center text-sm">
                    Account Security Protection Activated
                </p>
</div>
<div class="bg-red-50 dark:bg-red-900/10 border border-red-100 dark:border-red-900/30 rounded-xl p-4 mb-8 flex items-start space-x-3">
<span class="material-icons-round text-secondary mt-0.5 text-lg">lock_clock</span>
<div>
<h3 class="text-sm font-semibold text-secondary mb-1">账户暂时被锁定</h3>
<p class="text-xs text-text-sub-light dark:text-gray-400 leading-relaxed">
                        由于检测到多次登录失败，为保护您的账户安全，系统已自动限制访问。请在 15 分钟后重试或重置密码。
                    </p>
</div>
</div>
<div class="space-y-4 mb-8">
<h4 class="text-xs font-bold text-text-sub-light dark:text-text-sub-dark uppercase tracking-wider mb-3 pl-1">
                    锁定详情 (Lock Details)
                </h4>
<div class="flex items-center justify-between p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-white/5 transition-colors group">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-icons-round text-sm">wifi_off</span>
</div>
<span class="text-sm font-medium text-text-main-light dark:text-text-main-dark">
                            访问限制
                        </span>
</div>
<span class="text-xs font-medium text-red-500 bg-red-50 dark:bg-red-900/30 dark:text-red-300 px-2 py-1 rounded">
                        已生效
                    </span>
</div>
<div class="flex items-center justify-between p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-white/5 transition-colors group">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-icons-round text-sm">shield</span>
</div>
<span class="text-sm font-medium text-text-main-light dark:text-text-main-dark">
                            保护机制
                        </span>
</div>
<span class="text-xs text-text-sub-light dark:text-text-sub-dark">
                        暴力破解防护
                    </span>
</div>
<div class="flex items-center justify-between p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-white/5 transition-colors group">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-icons-round text-sm">schedule</span>
</div>
<span class="text-sm font-medium text-text-main-light dark:text-text-main-dark">
                            解锁时间
                        </span>
</div>
<span class="text-xs text-text-sub-light dark:text-text-sub-dark">
                        剩余 14:32
                    </span>
</div>
</div>
<div class="space-y-4">
<button class="w-full bg-gradient-to-r from-[#6B73D6] to-[#8B5CF6] hover:from-[#5d65c3] hover:to-[#7c4df0] text-white py-3.5 px-6 rounded-xl font-medium shadow-lg shadow-indigo-200 dark:shadow-none flex items-center justify-center space-x-2 transition-all transform active:scale-95">
<span class="material-icons-round text-lg">lock_reset</span>
<span>重置密码解除锁定</span>
</button>
<a class="block text-center text-sm text-primary hover:text-[#5d65c3] dark:text-indigo-400 dark:hover:text-indigo-300 font-medium transition-colors flex items-center justify-center gap-1 mt-4" href="#">
<span class="material-icons-round text-base">support_agent</span>
                    联系客服支持
                </a>
</div>
</div>
</main>
<div class="fixed bottom-8 right-8 flex flex-col space-y-4">
<button class="w-10 h-10 bg-white dark:bg-surface-dark rounded-full shadow-md flex items-center justify-center text-pink-300 hover:bg-gray-50 transition-colors">
<span class="material-icons-round text-xl">grid_view</span>
</button>
<button class="w-10 h-10 bg-pink-100 dark:bg-pink-900/30 rounded-full shadow-md flex items-center justify-center text-pink-400 hover:bg-pink-200 dark:hover:bg-pink-900/50 transition-colors">
<span class="material-icons-round text-xl">translate</span>
</button>
</div>
</body></html>
