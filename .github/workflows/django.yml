name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: knowledge_project
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: django-ci-insecure-key
      mysql_name: knowledge_project
      mysql_user: root
      mysql_passwd: root
      mysql_ip: 127.0.0.1
      mysql_port: 3306
      REDIS_URL: redis://127.0.0.1:6379/1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Install frontend dependencies
      run: |
        npm --prefix frontend ci
    - name: Check Django configuration
      run: |
        python manage.py check
    - name: Check migrations
      run: |
        python manage.py makemigrations --check --dry-run
    - name: Build frontend
      run: |
        npm --prefix frontend run build
    - name: Run Tests
      run: |
        python manage.py test accounts.tests notes.tests knowledge_project.tests
